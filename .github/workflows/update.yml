name: 보드 자동 갱신

on:
  schedule:
    # 한국시간 06:17~23:17 매시간 (GitHub 예약은 UTC 기준이고, 늦거나 가끔 건너뛸 수 있어 자주 돌린다)
    - cron: "17 0-14,21-23 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "template.html"
      - "data/base.json"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 공시·지수 수집 후 index.html 다시 만들기
        run: python3 scripts/update.py
      - name: 바뀐 내용 저장
        # 작업 브랜치에서는 만들기만 시험하고 저장하지 않는다(main 과 충돌 방지)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "보드 자동 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push || { git pull --rebase -X theirs origin main && git push; }
